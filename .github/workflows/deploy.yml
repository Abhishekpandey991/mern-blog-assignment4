name: MERN Blog CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Install and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        working-directory: mern-blog-assignment4/backend
        run: npm install

      - name: Check Backend Syntax
        working-directory: mern-blog-assignment4/backend
        run: node --check server.js

      - name: Install Frontend Dependencies
        working-directory: mern-blog-assignment4/frontend
        run: npm install

      - name: Build Frontend
        working-directory: mern-blog-assignment4/frontend
        run: npm run build

  deploy:
    name: Deploy to Render
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend
        run: curl -fsS -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

      - name: Deploy Frontend
        run: curl -fsS -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
